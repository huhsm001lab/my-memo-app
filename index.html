<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 메모장</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2272EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <main>
    <!-- ===== 메모 ===== -->
    <section id="tab-memo" class="panel">
      <h1 class="page-title">메모</h1>
      <form id="memo-form" class="card">
        <input id="memo-title" placeholder="메모 제목" required>
        <textarea id="memo-content" rows="4" placeholder="내용을 적어 보세요"></textarea>
        <div class="row">
          <button type="button" id="memo-star" class="star" title="중요 표시">☆</button>
          <button type="submit" id="memo-submit">메모 추가</button>
          <button type="button" id="memo-cancel" hidden>수정 취소</button>
        </div>
      </form>
      <div class="row filters">
        <input id="memo-search" type="search" placeholder="메모 검색">
        <label><input type="checkbox" id="memo-only-star"> ⭐ 중요만</label>
      </div>
      <div id="memo-list"></div>
    </section>

    <!-- ===== 할 일 ===== -->
    <section id="tab-todo" class="panel" hidden>
      <h1 class="page-title">할 일</h1>
      <form id="todo-form" class="card row">
        <input id="todo-title" placeholder="할 일 입력" required>
        <input id="todo-due" type="date" title="마감일 (선택)">
        <button type="button" id="todo-star" class="star" title="중요 표시">☆</button>
        <button type="submit">추가</button>
      </form>
      <div class="row filters">
        <label><input type="checkbox" id="todo-hide-done"> 완료 숨기기</label>
        <label><input type="checkbox" id="todo-today"> 오늘만</label>
        <label><input type="checkbox" id="todo-only-star"> ⭐ 중요만</label>
      </div>
      <div id="todo-list"></div>
    </section>

    <!-- ===== 캘린더 ===== -->
    <section id="tab-calendar" class="panel" hidden>
      <div class="row cal-head">
        <h1 class="page-title" id="cal-label"></h1>
        <span class="spacer"></span>
        <button id="cal-prev" class="round" aria-label="이전 달">◀</button>
        <button id="cal-next" class="round" aria-label="다음 달">▶</button>
        <button id="cal-today">오늘</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="day-panel" class="card"></div>
    </section>

    <!-- ===== 설정 ===== -->
    <section id="tab-settings" class="panel" hidden>
      <h1 class="page-title">설정</h1>
      <div class="card">
        <h3>알림</h3>
        <label class="line"><input type="checkbox" id="set-enabled"> 알림 사용</label>
        <label class="line">알릴 날짜
          <select id="set-days">
            <option value="0">마감 당일</option>
            <option value="1">마감 하루 전</option>
          </select>
        </label>
        <label class="line">알릴 시각
          <input type="time" id="set-time">
        </label>
        <div class="line">
          <button id="set-browser">브라우저 알림 허용하기</button>
          <span id="set-browser-state" class="hint"></span>
        </div>
        <p class="hint">브라우저 알림은 이 탭이 열려 있을 때만 울립니다. (앱이 꺼져 있을 때의 푸시 알림은 2단계에서 검토)</p>
      </div>
      <div class="card">
        <h3>데이터 백업</h3>
        <p class="hint">브라우저 데이터를 지우면 메모도 사라집니다. 가끔 내보내기로 파일에 보관해 두세요.</p>
        <div class="row">
          <button id="export-btn">내보내기 (파일 저장)</button>
          <button id="import-btn">가져오기</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="하단 메뉴">
    <button class="tab active" data-tab="memo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
      <span>메모</span>
    </button>
    <button class="tab" data-tab="todo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
      <span>할 일</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>캘린더</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
